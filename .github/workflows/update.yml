name: Update Bricks docs

on:
  # 02:00 Italian time. Cron is UTC only, so both offsets are scheduled and the
  # "Check Italian time" step keeps the one matching the current CET/CEST offset.
  schedule:
    - cron: "0 0 * * *" # 02:00 CEST (summer, UTC+2)
    - cron: "0 1 * * *" # 02:00 CET (winter, UTC+1)
  workflow_dispatch:
    inputs:
      full:
        description: "Re-download every page (ignore lastmod)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-docs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check Italian time
        id: tz
        run: |
          offset=$(TZ=Europe/Rome date +%z)
          run=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$offset" = "+0200" ] && [ "${{ github.event.schedule }}" != "0 0 * * *" ]; then run=false; fi
            if [ "$offset" = "+0100" ] && [ "${{ github.event.schedule }}" != "0 1 * * *" ]; then run=false; fi
          fi
          echo "Europe/Rome offset $offset, run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.tz.outputs.run == 'true'

      - uses: actions/setup-python@v6
        if: steps.tz.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.tz.outputs.run == 'true'

      - name: Export academy.bricksbuilder.io to Markdown
        if: steps.tz.outputs.run == 'true'
        run: python scrape.py --out-dir . ${{ inputs.full && '--full' || '' }}

      - name: Commit if the docs changed
        if: steps.tz.outputs.run == 'true'
        run: |
          git add -A bricks-docs.md sections llms.txt skill dist state
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Bricks docs $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
