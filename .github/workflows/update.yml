name: Update Bricks docs

on:
  schedule:
    - cron: "17 4 * * *" # every day at 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-docs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape academy.bricksbuilder.io
        run: python scrape.py --output bricks-docs.md

      - name: Commit if the docs changed
        run: |
          if git diff --quiet -- bricks-docs.md && git ls-files --error-unmatch bricks-docs.md >/dev/null 2>&1; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bricks-docs.md
          git commit -m "Update Bricks docs $(date -u +%Y-%m-%d)"
          git push
