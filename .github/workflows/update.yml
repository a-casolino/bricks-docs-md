name: Update Bricks docs

on:
  schedule:
    - cron: "17 4 * * *" # every day at 04:17 UTC
  workflow_dispatch:
    inputs:
      full:
        description: "Re-download every page (ignore lastmod)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-docs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Export academy.bricksbuilder.io to Markdown
        run: python scrape.py --out-dir . ${{ inputs.full && '--full' || '' }}

      - name: Commit if the docs changed
        run: |
          git add -A bricks-docs.md sections llms.txt skill dist state
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Bricks docs $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
